name: Android CI

on:
  push:
    branches: [ "main", "MyNexAlloy" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: write
    # The secrets context is not available in a step-level `if`, so surface the one fact the
    # steps need as a job-level env var.
    env:
      HAS_KEYSTORE: ${{ secrets.KEYSTORE != '' }}

    steps:
    - uses: actions/checkout@v6
      with:
        submodules: true
        # `gh release create` needs the tag history to build the compare link.
        fetch-depth: 0

    - name: set up JDK
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # Signing is skipped when the keystore secret is absent: forks without secrets, and pull
    # requests, which never receive them. The release build still compiles, just unsigned.
    - name: Write key
      if: github.event_name == 'push' && env.HAS_KEYSTORE == 'true'
      run: |
        echo KEYSTORE_PASSWORD='${{ secrets.KEYSTORE_PASSWORD }}' > signing.properties
        echo KEYSTORE_ALIAS='${{ secrets.KEYSTORE_ALIAS }}' >> signing.properties
        echo KEYSTORE_ALIAS_PASSWORD='${{ secrets.KEYSTORE_ALIAS_PASSWORD }}' >> signing.properties
        echo KEYSTORE_FILE=../key.jks >> signing.properties
        echo '${{ secrets.KEYSTORE }}' | base64 --decode > key.jks

    - name: Build Debug
      run: ./gradlew assembleDebug

    - name: Build Release
      run: ./gradlew assembleRelease

    - name: Upload a Debug Artifact
      uses: actions/upload-artifact@v7
      with:
        name: nexalloy-ci-debug-apk
        path: app/build/outputs/apk/debug

    - name: Upload a Release Artifact
      uses: actions/upload-artifact@v7
      with:
        name: nexalloy-ci-release-apk
        path: |
          app/build/outputs/apk/release
          app/build/outputs/mapping/release/mapping.txt

    # Only main publishes the nightly, and only when the APK is actually signed — an unsigned
    # APK cannot be installed, so there would be nothing worth publishing.
    - name: Create AutoBuild Release
      if: github.ref == 'refs/heads/main' && env.HAS_KEYSTORE == 'true'
      run: |
        set -uo pipefail
        LATEST_REL=$(gh release view --json tagName -q .tagName || true)
        GIT_DESCRIBE=$(git rev-parse --short HEAD)
        cd app/build/outputs/apk/release/
        mv app-release.apk "NexAlloy-${GIT_DESCRIBE}.apk"
        if [ -n "${LATEST_REL}" ]; then
          NOTES="Nightly build from commit ${GIT_DESCRIBE}. See changes: https://github.com/${{ github.repository }}/compare/${LATEST_REL}...main"
        else
          NOTES="Nightly build from commit ${GIT_DESCRIBE}."
        fi
        # --cleanup-tag: without it the `autobuild` tag outlives the delete, and the recreated
        # release stays pinned to whichever commit first produced it.
        gh release delete autobuild --yes --cleanup-tag || true
        gh release create autobuild "NexAlloy-${GIT_DESCRIBE}.apk" --prerelease --title "Nightly Build ${GIT_DESCRIBE}" --notes "${NOTES}"
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
