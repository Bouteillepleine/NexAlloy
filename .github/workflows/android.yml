name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

# Only `Create AutoBuild Release` needs write; everything else reads.
permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      with:
        submodules: true
        fetch-depth: 0

    - name: set up JDK
      uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # The release signing key is deliberately NOT written here. This job runs on
    # every push, so materialising it made the key's exposure window the whole
    # commit history rather than tag events. Nightlies are debug-signed by the
    # fallback in app/build.gradle.kts; only release.yml (tags) uses the real key.

    - name: Verify vendored binaries
      run: ./scripts/verify-libs.sh

    - name: Test
      run: ./gradlew test

    - name: Build Debug
      run: ./gradlew assembleDebug

    - name: Build Release
      run: ./gradlew assembleRelease

    - name: Upload a Debug Artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: nexalloy-ci-debug-apk
        path: app/build/outputs/apk/debug

    - name: Upload a Release Artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: nexalloy-ci-release-apk
        path: |
          app/build/outputs/apk/release
          app/build/outputs/mapping/release/mapping.txt

    - name: Upload test report on failure
      if: failure()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: nexalloy-test-report
        path: app/build/reports/tests

    # Nightlies land on a fixed prerelease tag. `--clobber` replaces the asset in
    # place; the previous delete-then-create removed the release outright on every
    # push (breaking any existing link) and `|| true` swallowed real failures.
    - name: Create AutoBuild Release
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: |
        set -euo pipefail
        LATEST_REL=$(gh release view --json tagName -q .tagName 2>/dev/null || echo "")
        GIT_DESCRIBE=$(git rev-parse --short HEAD)
        cd app/build/outputs/apk/release/
        mv app-release.apk "NexAlloy-${GIT_DESCRIBE}.apk"
        if [ -n "$LATEST_REL" ]; then
          NOTES="Nightly build from commit ${GIT_DESCRIBE}. See changes: https://github.com/${GH_REPO}/compare/${LATEST_REL}...main"
        else
          NOTES="Nightly build from commit ${GIT_DESCRIBE}."
        fi
        if gh release view autobuild >/dev/null 2>&1; then
          gh release upload autobuild "NexAlloy-${GIT_DESCRIBE}.apk" --clobber
          gh release edit autobuild --title "Nightly Build ${GIT_DESCRIBE}" --notes "$NOTES"
        else
          gh release create autobuild "NexAlloy-${GIT_DESCRIBE}.apk" \
            --prerelease \
            --title "Nightly Build ${GIT_DESCRIBE}" \
            --notes "$NOTES"
        fi
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GH_REPO: ${{ github.repository }}
