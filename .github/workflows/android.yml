name: Android CI

on:
  push:
    branches: [ "main", "MyNexAlloy" ]
  pull_request:
    branches: [ "main", "MyNexAlloy" ]
  # Lets a build be kicked off by hand from any branch of the fork.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: write
    # The secrets context is not available in a step-level `if`, so surface the facts the steps
    # need as job-level env vars.
    env:
      HAS_KEYSTORE: ${{ secrets.KEYSTORE != '' }}
      HAS_YOUTUBE_APK: ${{ secrets.YOUTUBE_APK_URL != '' }}
      HAS_MUSIC_APK: ${{ secrets.YT_MUSIC_APK_URL != '' }}

    steps:
    - uses: actions/checkout@v6
      with:
        submodules: true
        # `gh release create` needs the tag history to build the compare link.
        fetch-depth: 0

    - name: set up JDK
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # Signing is skipped when the keystore secret is absent: forks without secrets, and pull
    # requests, which never receive them. The release build still compiles, just unsigned.
    - name: Write key
      if: github.event_name != 'pull_request' && env.HAS_KEYSTORE == 'true'
      run: |
        echo KEYSTORE_PASSWORD='${{ secrets.KEYSTORE_PASSWORD }}' > signing.properties
        echo KEYSTORE_ALIAS='${{ secrets.KEYSTORE_ALIAS }}' >> signing.properties
        echo KEYSTORE_ALIAS_PASSWORD='${{ secrets.KEYSTORE_ALIAS_PASSWORD }}' >> signing.properties
        echo KEYSTORE_FILE=../key.jks >> signing.properties
        echo '${{ secrets.KEYSTORE }}' | base64 --decode > key.jks

    - name: Build Debug
      run: ./gradlew assembleDebug

    - name: Build Release
      run: ./gradlew assembleRelease

    - name: Upload a Debug Artifact
      uses: actions/upload-artifact@v7
      with:
        name: nexalloy-ci-debug-apk
        path: app/build/outputs/apk/debug

    - name: Upload a Release Artifact
      uses: actions/upload-artifact@v7
      with:
        name: nexalloy-ci-release-apk
        path: |
          app/build/outputs/apk/release
          app/build/outputs/mapping/release/mapping.txt

    # app/binaries feeds FingerprintsKtTest, which resolves every DexKit fingerprint against a
    # real APK — the check that catches a YouTube update breaking a patch before users do.
    # The URLs must point at a copy you control (a private release asset, your own storage).
    # This deliberately does not scrape APK mirror sites: their terms forbid automated
    # downloading, and the binaries are Google's to distribute, not ours.
    - name: Fetch target APKs
      if: env.HAS_YOUTUBE_APK == 'true' || env.HAS_MUSIC_APK == 'true'
      run: |
        set -euo pipefail
        mkdir -p app/binaries
        if [ -n '${{ secrets.YOUTUBE_APK_URL }}' ]; then
          curl -fsSL '${{ secrets.YOUTUBE_APK_URL }}' -o app/binaries/com.google.android.youtube.apk
        fi
        if [ -n '${{ secrets.YT_MUSIC_APK_URL }}' ]; then
          curl -fsSL '${{ secrets.YT_MUSIC_APK_URL }}' -o app/binaries/com.google.android.apps.youtube.music.apk
        fi
        ls -la app/binaries/

    # Skips itself when app/binaries is empty, so this is a no-op until an APK source is set.
    - name: Fingerprint tests
      run: ./gradlew :app:testDebugUnitTest

    - name: Upload fingerprint test report
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: nexalloy-fingerprint-report
        path: app/build/reports/tests/testDebugUnitTest
        if-no-files-found: ignore

    # The nightly comes from MyNexAlloy, the default branch and the one that actually
    # receives work: `main` is pinned to upstream and never pushed, so gating on it would
    # mean no nightly is ever published. Skipped without a key, since an unsigned APK
    # cannot be installed.
    - name: Create AutoBuild Release
      if: github.ref == 'refs/heads/MyNexAlloy' && env.HAS_KEYSTORE == 'true'
      run: |
        set -uo pipefail
        cd app/build/outputs/apk/release/

        # Publish only once the APK actually exists. The old nightly is deleted to make way for
        # the new one, so that deletion must not happen until there is something to replace it
        # with — otherwise a build that produced no APK leaves no nightly at all.
        if [ ! -s app-release.apk ]; then
          echo '::error::No release APK was produced; leaving the existing nightly in place.'
          exit 1
        fi

        LATEST_REL=$(gh release view --json tagName -q .tagName || true)
        GIT_DESCRIBE=$(git rev-parse --short HEAD)
        mv app-release.apk "NexAlloy-${GIT_DESCRIBE}.apk"
        if [ -n "${LATEST_REL}" ]; then
          NOTES="Nightly build from commit ${GIT_DESCRIBE}. See changes: https://github.com/${{ github.repository }}/compare/${LATEST_REL}...MyNexAlloy"
        else
          NOTES="Nightly build from commit ${GIT_DESCRIBE}."
        fi
        # --cleanup-tag: without it the `autobuild` tag outlives the delete, and the recreated
        # release stays pinned to whichever commit first produced it.
        gh release delete autobuild --yes --cleanup-tag || true
        gh release create autobuild "NexAlloy-${GIT_DESCRIBE}.apk" --prerelease --title "Nightly Build ${GIT_DESCRIBE}" --notes "${NOTES}"
        echo "Published nightly NexAlloy-${GIT_DESCRIBE}.apk" >> "$GITHUB_STEP_SUMMARY"
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
