name: Android Release CI

# Releases are cut by tagging a commit, so this works from any branch of the fork —
# tag a MyNexAlloy commit and the release is built from it.
on:
  push:
    tags:
      - '*.*.*'

jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: write
    # The secrets context is not available in a step-level `if`.
    env:
      HAS_KEYSTORE: ${{ secrets.KEYSTORE != '' }}
      HAS_YOUTUBE_APK: ${{ secrets.YOUTUBE_APK_URL != '' }}
      HAS_MUSIC_APK: ${{ secrets.YT_MUSIC_APK_URL != '' }}

    steps:
    - uses: actions/checkout@v6
      with:
        submodules: true

    - name: set up JDK
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # Publishing an unsigned APK is worse than publishing nothing, so stop before the build
    # rather than shipping something nobody can install.
    - name: Require signing key
      if: env.HAS_KEYSTORE != 'true'
      run: |
        echo '::error::No KEYSTORE secret is configured; a release cannot be signed.'
        exit 1

    - name: Write key
      run: |
        echo KEYSTORE_PASSWORD='${{ secrets.KEYSTORE_PASSWORD }}' > signing.properties
        echo KEYSTORE_ALIAS='${{ secrets.KEYSTORE_ALIAS }}' >> signing.properties
        echo KEYSTORE_ALIAS_PASSWORD='${{ secrets.KEYSTORE_ALIAS_PASSWORD }}' >> signing.properties
        echo KEYSTORE_FILE=../key.jks >> signing.properties
        echo '${{ secrets.KEYSTORE }}' | base64 --decode > key.jks

    # See android.yml for why the APKs come from a location you control rather than a mirror.
    - name: Fetch target APKs
      if: env.HAS_YOUTUBE_APK == 'true' || env.HAS_MUSIC_APK == 'true'
      run: |
        set -euo pipefail
        mkdir -p app/binaries
        if [ -n '${{ secrets.YOUTUBE_APK_URL }}' ]; then
          curl -fsSL '${{ secrets.YOUTUBE_APK_URL }}' -o app/binaries/com.google.android.youtube.apk
        fi
        if [ -n '${{ secrets.YT_MUSIC_APK_URL }}' ]; then
          curl -fsSL '${{ secrets.YT_MUSIC_APK_URL }}' -o app/binaries/com.google.android.apps.youtube.music.apk
        fi
        ls -la app/binaries/

    # Gates the release: if a fingerprint no longer resolves against the target APK, the patch
    # is broken for that app version and the release must not go out. No APKs configured means
    # the task skips, and the release proceeds unverified.
    - name: Fingerprint tests
      run: ./gradlew :app:testDebugUnitTest

    - name: Upload fingerprint test report
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: nexalloy-release-fingerprint-report
        path: app/build/reports/tests/testDebugUnitTest
        if-no-files-found: ignore

    - name: Build Release
      run: ./gradlew assembleRelease

    # Deliberately not --prerelease: the in-app update check reads /releases/latest, and GitHub
    # resolves that to the newest release that is *not* a prerelease. Publishing every tag as a
    # prerelease made that endpoint return 404 (or a stale release), so users were told they were
    # up to date no matter how many versions they were behind.
    - name: Publish release
      run: |
        cd app/build/outputs/apk/release/
        mv app-release.apk "NexAlloy-${{ github.ref_name }}.apk"
        gh release create "${{ github.ref_name }}" "NexAlloy-${{ github.ref_name }}.apk" --title "${{ github.ref_name }}" --generate-notes
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
